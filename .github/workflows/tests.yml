name: 服务端测试

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            os: ubuntu-22.04
          - python-version: '3.10'
            os: ubuntu-24.04
          - python-version: '3.11'
            os: ubuntu-24.04
          - python-version: '3.13'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 跑单元测试
        working-directory: server
        run: python -m unittest discover -s tests -v
