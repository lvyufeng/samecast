<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SameCast · 控制台</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
         background:#111318; color:#e6e8ee; }
  .wrap { max-width:900px; margin:0 auto; padding:24px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
  .sub { color:#8b93a7; font-size:13px; margin-bottom:20px; }
  .card { background:#1a1d25; border:1px solid #262b36; border-radius:12px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { background:#2b3242; color:#e6e8ee; border:1px solid #3a4256; border-radius:8px;
           padding:8px 14px; font-size:14px; cursor:pointer; }
  button:hover { background:#353d50; }
  button.primary { background:#3b5bdb; border-color:#4c6ef5; }
  input[type=text] { flex:1; min-width:240px; background:#12141a; color:#e6e8ee;
                     border:1px solid #2c3240; border-radius:8px; padding:8px 10px; font-size:13px; }
  .state { font-size:28px; font-weight:700; letter-spacing:.5px; }
  .state.PLAYING { color:#51cf66; } .state.PAUSED_PLAYBACK { color:#ffd43b; }
  .state.STOPPED, .state.NO_MEDIA_PRESENT { color:#8b93a7; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  .recv { display:flex; justify-content:space-between; padding:10px 12px; border-radius:8px;
          background:#12141a; margin-top:8px; font-size:13px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:#666; }
  .dot.ok { background:#51cf66; } .dot.bad { background:#e03131; }
  .muted { color:#8b93a7; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SameCast 网关</h1>
  <div class="sub">手机在投屏 App 里选择「<span id="devname">SameCast</span>」即可；这里可以查看状态、手动测试。</div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><div class="state" id="state">—</div><div class="muted" id="title">未投屏</div></div>
      <div class="mono" id="time">0:00 / 0:00</div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" onclick="ctl('play')">播放</button>
      <button onclick="ctl('pause')">暂停</button>
      <button onclick="ctl('stop')">停止</button>
      <button onclick="seek(-10)">« 10s</button>
      <button onclick="seek(10)">10s »</button>
      <input type="range" min="0" max="100" onchange="ctl('volume',{volume:+this.value})" value="50" style="width:120px">
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="muted">B 站小电视：粘贴视频/番剧链接，服务器直接拉高清流投给所有电视</div>
      <div class="muted" id="biliWho">—</div>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="biliText" placeholder="粘贴 https://www.bilibili.com/video/BV… 或 B 站分享文字">
      <button class="primary" onclick="biliPlay()">播放</button>
      <button id="biliLoginBtn" onclick="biliLogin()">登录</button>
    </div>
    <div class="muted" id="biliMsg" style="margin-top:8px"></div>
  </div>

  <div class="card" id="biliQrCard" style="display:none;text-align:center">
    <div class="row" style="justify-content:space-between">
      <div class="muted">用「哔哩哔哩」手机 App 扫码登录（只保存在本机配置文件）</div>
      <button onclick="biliCloseQr()">关闭</button>
    </div>
    <div style="margin-top:12px;line-height:0" id="biliQr"></div>
    <div class="muted" id="biliQrMsg" style="margin-top:10px">等待扫码…</div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px">接收端</div>
    <div id="recvs"></div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px">手动测试：粘贴一个 m3u8 / mp4 直链，点载入并播放</div>
    <div class="row">
      <input type="text" id="uri" placeholder="https://example.com/video.m3u8">
      <button class="primary" onclick="loadUri()">载入并播放</button>
    </div>
  </div>

  <div class="card muted mono" id="raw"></div>
</div>
<script>
let snap = null;
let biliKey = null, biliTimer = null;
const KIND_LABEL = { app:'电视', web:'网页', kodi:'Kodi' };
function fmt(s){ s=Math.max(0,Math.floor(s||0)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+":":"")+(h?String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); }
async function refresh(){
  try {
    const r = await fetch('/api/status'); snap = await r.json();
    document.getElementById('state').textContent = snap.state;
    document.getElementById('state').className = 'state ' + snap.state;
    document.getElementById('title').textContent = snap.title || snap.uri || '未投屏';
    document.getElementById('time').textContent = fmt(snap.position) + ' / ' + fmt(snap.duration);
    const box = document.getElementById('recvs');
    box.innerHTML = (snap.receivers||[]).map(r =>
      '<div class="recv"><span><span class="dot '+(r.state!=='idle'&&r.state!=='unknown'?'ok':'bad')+'"></span>'
      + r.name + ' <span class="muted">('+(KIND_LABEL[r.kind]||r.kind)+')</span></span>'
      + '<span class="mono">'+r.state+' · '+fmt(r.position)+'</span></div>').join('');
    document.getElementById('raw').textContent = JSON.stringify(snap, null, 1).slice(0, 1200);
  } catch(e) { document.getElementById('state').textContent = '离线'; }
}
async function ctl(cmd, extra){
  await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({cmd}, extra||{}))});
  refresh();
}
function seek(delta){
  if(!snap) return;
  ctl('seek',{position: Math.max(0, snap.position + delta)});
}
async function loadUri(){
  const uri = document.getElementById('uri').value.trim();
  if(!uri) return;
  await ctl('load',{uri});
  await ctl('play');
}
async function biliStatus(){
  const who = document.getElementById('biliWho');
  const btn = document.getElementById('biliLoginBtn');
  try {
    const r = await fetch('/api/bili/status'); const s = await r.json();
    if(!s.ok){ who.textContent = s.error || 'B 站模块不可用'; btn.style.display = 'none'; return; }
    btn.style.display = '';
    who.textContent = s.logged_in
      ? '已登录 ' + (s.uname||'') + (s.vip ? ' · 大会员' : '') + ' · 最高 ' + s.max_quality
      : s.hint;
    btn.textContent = s.logged_in ? '退出' : '登录';
    btn.onclick = s.logged_in ? biliLogout : biliLogin;
  } catch(e) { who.textContent = 'B 站状态离线'; }
}
async function biliPlay(){
  const text = document.getElementById('biliText').value.trim();
  const msg = document.getElementById('biliMsg');
  if(!text){ msg.textContent = '先粘贴一个 B 站链接'; return; }
  msg.textContent = '正在解析…';
  try {
    const r = await fetch('/api/bili/play',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})});
    const d = await r.json();
    if(d.ok){
      msg.textContent = '已投放：' + d.title + ' [' + d.quality + (d.codec ? ' ' + d.codec : '')
        + (d.width ? ' ' + d.width + 'x' + d.height : '') + '] · ' + d.receivers + ' 台';
      refresh();
    } else { msg.textContent = '失败：' + (d.error || '未知错误'); }
  } catch(e) { msg.textContent = '请求失败，检查服务器是否在线'; }
}
async function biliLogin(){
  const card = document.getElementById('biliQrCard');
  const box = document.getElementById('biliQr');
  const msg = document.getElementById('biliQrMsg');
  card.style.display = ''; box.innerHTML = ''; msg.textContent = '正在生成二维码…';
  try {
    const r = await fetch('/api/bili/qr',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const d = await r.json();
    if(!d.ok){ msg.textContent = d.error || '生成二维码失败'; return; }
    biliKey = d.key; box.innerHTML = d.svg; msg.textContent = '请用 B 站手机 App 扫码';
    biliTimer = setInterval(biliPoll, 2000);
  } catch(e) { msg.textContent = '请求失败，检查服务器是否在线'; }
}
async function biliPoll(){
  const msg = document.getElementById('biliQrMsg');
  if(!biliKey) return;
  try {
    const r = await fetch('/api/bili/qr/poll',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key:biliKey})});
    const d = await r.json();
    if(!d.ok){ msg.textContent = d.error || '查询失败'; biliCloseQr(); return; }
    if(d.status === 'waiting') msg.textContent = '等待扫码…';
    else if(d.status === 'scanned') msg.textContent = '已扫码，请在手机上确认登录';
    else if(d.status === 'ok'){
      biliCloseQr();
      document.getElementById('biliMsg').textContent = '登录成功' + (d.uname ? '：' + d.uname : '');
      biliStatus();
    } else if(d.status === 'expired'){ msg.textContent = '二维码已过期，请重新点「登录」'; }
    else { msg.textContent = d.message || '登录失败'; }
  } catch(e) { /* 网络抖动，下一轮再试 */ }
}
function biliCloseQr(){
  if(biliTimer){ clearInterval(biliTimer); biliTimer = null; }
  biliKey = null;
  document.getElementById('biliQrCard').style.display = 'none';
  document.getElementById('biliQr').innerHTML = '';
}
async function biliLogout(){
  await fetch('/api/bili/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  document.getElementById('biliMsg').textContent = '已退出登录，清晰度回到未登录上限';
  biliStatus();
}
refresh(); biliStatus(); setInterval(refresh, 1000); setInterval(biliStatus, 30000);
</script>
</body>
</html>
